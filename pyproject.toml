[project]
name = "jev-hierarchy"
version = "0.1.0"
description = "Recursive Jev forced-choice walk over a category tree"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "typesafe-sdk>=0.5.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
